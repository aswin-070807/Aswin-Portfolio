  <line x1="36.5" y1="36.5" x2="49" y2="49" stroke="#FFD21F" stroke-width="5.5" stroke-linecap="round"/>
  <!-- 3 curved fingerprint lines inside lens -->
  <path d="M 20 29 A 7 7 0 0 1 34 29" fill="none" stroke="#FFD21F" stroke-width="2" stroke-linecap="round"/>
  <path d="M 22.5 28 A 4.5 4.5 0 0 1 31.5 28" fill="none" stroke="#FFD21F" stroke-width="2" stroke-linecap="round"/>
  <path d="M 25 27 A 2 2 0 0 1 29 27" fill="none" stroke="#FFD21F" stroke-width="2" stroke-linecap="round"/>
</svg>
