<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0B0B0F"/>
  <!-- Magnifying glass lens ring -->
  <circle cx="27" cy="27" r="13" fill="none" stroke="#FFD21F" stroke-width="4.5"/>
